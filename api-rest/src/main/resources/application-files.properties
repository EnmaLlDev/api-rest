# Profile-specific properties for 'files' session
# Activate with: --spring.profiles.active=files

# 1) Disable JDBC auto-config to avoid DB connection when using files
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# 2) CSV configuration overrides (adjust as needed)
csv.ruta.base=src/main/resources/ficheros/
csv.ruta.input-file-name=prueba.csv
csv.ruta.output-file-name=patients_out.csv

# Parser
csv.parser.delimiter=,
csv.parser.skip-headers=true
csv.parser.encoding=UTF-8

# 3) Selector de origen de datos para tu lógica
# Valores: "jdbc" | "csv"
app.data.source=csv