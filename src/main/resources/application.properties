#(JDBC)
spring.application.name=udam2

spring.datasource.url=jdbc:mysql://localhost:3306/clinica_db
spring.datasource.username=root
# MySQL
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 'update' para que Hibernate actualice
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

spring.profiles.active=local
spring.jpa.defer-datasource-initialization=true
spring.datasource.hikari.pool-name=udam2Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.idle-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Seguridad JWT
app.security.jwt.secret=change-this-to-a-very-long-random-secret-key-for-hs256
app.security.jwt.access-token-expiration-ms=900000
app.security.jwt.refresh-token-expiration-ms=604800000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method