# Base de Datos (JDBC)
spring.application.name=udam2

spring.datasource.url=jdbc:mysql://localhost:3306/clinica
spring.datasource.username=root
# Cambiar la contrase?a seg?n tu configuraci?n de MySQL
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Cambiar a 'update' para que Hibernate actualice el esquema de la base de datos autom?ticamente
# Nota: En producci?n, es recomendable usar 'validate' o 'none'
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

spring.profiles.active=local

spring.datasource.hikari.pool-name=udam2Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.idle-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Seguridad JWT
app.security.jwt.secret=change-this-to-a-very-long-random-secret-key-for-hs256
app.security.jwt.access-token-expiration-ms=900000
app.security.jwt.refresh-token-expiration-ms=604800000
